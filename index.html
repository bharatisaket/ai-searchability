<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotable AI Search Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one reading column; summary (score + engines) first, then fixes, then evidence. */
:root {
  --paper: #f3f5f8;
  --card: #ffffff;
  --ink: #131a26;
  --muted: #566176;
  --line: #d8dee8;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --good: #14784a;  --good-bg: #e2f3ea;
  --warn: #96590a;  --warn-bg: #fbefd9;
  --bad: #b3312a;   --bad-bg: #fbe6e3;
  --idle: #566176;  --idle-bg: #e8ecf2;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141d; --card: #171e2a; --ink: #e8ecf3; --muted: #9aa6ba; --line: #2a3445;
    --accent: #7ea2ff; --accent-ink: #0b1220;
    --good: #5fd39a; --good-bg: #12301f; --warn: #f0b860; --warn-bg: #3a2a0c;
    --bad: #ff8f86; --bad-bg: #3d1614; --idle: #9aa6ba; --idle-bg: #222b3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141d; --card: #171e2a; --ink: #e8ecf3; --muted: #9aa6ba; --line: #2a3445;
  --accent: #7ea2ff; --accent-ink: #0b1220;
  --good: #5fd39a; --good-bg: #12301f; --warn: #f0b860; --warn-bg: #3a2a0c;
  --bad: #ff8f86; --bad-bg: #3d1614; --idle: #9aa6ba; --idle-bg: #222b3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); }
.wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 64px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; font-family: var(--body); }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
header.top { display: flex; flex-direction: column; gap: 6px; }
header.top p { color: var(--muted); max-width: 62ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
label { font-weight: 500; font-size: 14px; }
input[type="url"], input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px;
}
textarea { font-family: var(--mono); font-size: 13px; min-height: 110px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grow { flex: 1 1 260px; }
button { font: 500 15px var(--body); border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.6; cursor: wait; }
.field { display: flex; flex-direction: column; gap: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.notice { border-left: 3px solid var(--accent); background: var(--idle-bg); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14.5px; }
.notice.err { border-color: var(--bad); background: var(--bad-bg); }
.pill { display: inline-block; font: 500 12.5px var(--body); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.s-good { color: var(--good); background: var(--good-bg); }
.s-warn { color: var(--warn); background: var(--warn-bg); }
.s-bad { color: var(--bad); background: var(--bad-bg); }
.s-idle { color: var(--idle); background: var(--idle-bg); }
.summary { display: grid; grid-template-columns: 1fr 190px; gap: 24px; align-items: start; }
.verdict { font: 600 20px/1.3 var(--display); text-wrap: balance; padding-left: 12px; border-left: 4px solid var(--idle); }
.verdict.v-bad { border-color: var(--bad); } .verdict.v-warn { border-color: var(--warn); } .verdict.v-good { border-color: var(--good); }
.exceptions { margin-top: 12px; overflow-wrap: anywhere; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.steps li { display: flex; gap: 9px; align-items: baseline; color: var(--muted); }
.steps li.done { color: var(--ink); }
.steps .mark { width: 1.1em; text-align: center; font-family: var(--mono); }
.steps li.done .mark { color: var(--good); }
.steps li.bad .mark { color: var(--bad); }
details.more { margin-top: 2px; }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 500; padding: 6px 0; }
details.more[open] > summary { margin-bottom: 8px; }
.fix pre { margin: 4px 0; }
label.check { font-weight: 400; display: flex; gap: 7px; align-items: center; }
label.check input { accent-color: var(--accent); }
.intro ul.plain { gap: 10px; }
th button.link { color: inherit; text-decoration: none; font-size: inherit; }
.dial { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.dial svg { width: 150px; height: 150px; }
.dial .num { font: 700 44px var(--display); fill: var(--ink); font-variant-numeric: tabular-nums; }
.dial .of { font: 500 12px var(--body); fill: var(--muted); }
.engines { display: flex; flex-direction: column; }
.engine { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.engine:first-child { border-top: 0; padding-top: 0; }
.engine .why { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.engine .name { font-weight: 600; }
.fixes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: fix; }
.fix { counter-increment: fix; border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.fix.blocker { border-left-color: var(--bad); }
.fix.warning, .fix.fix-l { border-left-color: var(--warn); }
.fix.improve { border-left-color: var(--idle); }
.fix .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fix .head strong::before { content: counter(fix) ". "; color: var(--muted); font-variant-numeric: tabular-nums; }
.fix .do { font-size: 15px; }
pre { margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
details.group { border-top: 1px solid var(--line); padding: 12px 0 2px; }
details.group:first-of-type { border-top: 0; }
details.group summary { cursor: pointer; display: grid; grid-template-columns: 1fr 120px 64px; gap: 12px; align-items: center; list-style: none; }
details.group summary::-webkit-details-marker { display: none; }
details.group summary .gname::before { content: "+ "; color: var(--muted); font-family: var(--mono); }
details.group[open] summary .gname::before { content: "- "; }
.bar { height: 8px; background: var(--idle-bg); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.pts { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13.5px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; margin-top: 10px; }
th, td { text-align: left; padding: 8px 10px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 13px; border-top: 0; }
td.n { font-family: var(--mono); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
.checks label { font-weight: 400; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.checks input { margin-top: 5px; accent-color: var(--accent); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
footer { color: var(--muted); font-size: 13.5px; }
footer ul { margin: 6px 0 0; padding-left: 18px; columns: 2; column-gap: 28px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.scope { border: 0; padding: 0; margin: 0; display: flex; gap: 6px 20px; flex-wrap: wrap; }
.scope label { font-weight: 400; font-size: 15px; display: flex; gap: 7px; align-items: center; }
.scope input { accent-color: var(--accent); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font: inherit; text-align: left; overflow-wrap: anywhere; }
.fix details summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
.fix details ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; overflow-wrap: anywhere; }
#detail { display: flex; flex-direction: column; gap: 22px; }
#detail:empty { display: none; }
#report { display: flex; flex-direction: column; gap: 22px; }
@media (max-width: 640px) {
  .summary, .two { grid-template-columns: 1fr; }
  details.group summary { grid-template-columns: 1fr 70px 56px; }
  footer ul { columns: 1; }
  h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: no-preference) { .dial circle.arc { transition: stroke-dashoffset 0.6s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Quotable</h1>
    <p>Check whether AI search engines can reach a page and quote it. Every finding cites the engine's own documentation.</p>
  </header>

  <section class="card" aria-label="Run an audit">
    <form id="form" class="field" novalidate>
      <label for="url">Page URL</label>
      <div class="row">
        <input class="grow" id="url" type="url" inputmode="url" placeholder="https://example.com/pricing" autocomplete="url">
        <button class="primary" id="run" type="submit">Run audit</button>
      </div>
      <fieldset id="scope" class="scope" hidden>
        <legend class="sr">What to audit</legend>
        <label><input type="radio" name="scope" value="page" checked> This page</label>
        <label><input type="radio" name="scope" value="site"> Whole site</label>
      </fieldset>
      <div id="modeNote" class="small muted"></div>
      <div id="paste" hidden>
        <div class="two">
          <div class="field">
            <label for="html">Page source</label>
            <textarea id="html" placeholder="Open the page, choose View Source, and paste the HTML here" spellcheck="false"></textarea>
          </div>
          <div class="field">
            <label for="robots">robots.txt</label>
            <textarea id="robots" placeholder="Paste the contents of yoursite.com/robots.txt (leave empty if the site has none)" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <div id="report"></div>

  <footer>
    Rules come from these guides. The score reports access and readability. It does not predict rankings or citations.
    <a href="https://github.com/bharatisaket/ai-searchability/blob/main/docs/SPEC.md" target="_blank" rel="noopener">How the score is built</a>
    <ul id="sources"></ul>
  </footer>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.AuditEngine;
  var $ = function (id) { return document.getElementById(id); };
  var LIVE_URL = 'https://quotable-6j8a.onrender.com/';
  var SPEC_URL = 'https://github.com/bharatisaket/ai-searchability/blob/main/docs/SPEC.md';
  var live = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function src(s) { return s ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>' : ''; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function list(names) { return names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]; }

  var STATE = {
    open: ['Open', 's-good'], partial: ['Partly open', 's-warn'], blocked: ['Blocked', 's-bad'],
    firewall: ['Check firewall', 's-bad'], restricted: ['Opted out', 's-bad'], signin: ['Sign-in required', 's-bad'],
    unknown: ['Not checked', 's-idle']
  };
  var CHECK = { pass: ['Pass', 's-good'], warn: ['Partial', 's-warn'], fail: ['Fail', 's-bad'], na: ['Not applicable', 's-idle'] };
  var LEVEL = { blocker: ['Blocking', 's-bad'], warning: ['Worth fixing', 's-warn'], fix: ['Worth fixing', 's-warn'], improve: ['Optional', 's-idle'] };
  var SHORT = { google: 'Google', bing: 'Copilot and Bing', chatgpt: 'ChatGPT', claude: 'Claude', perplexity: 'Perplexity' };
  var MANUAL = [
    ['gsc', 'Site is verified in Google Search Console, and the generative AI control is set to include the site', 'G2'],
    ['bwt', 'Site is added to Bing Webmaster Tools, the sitemap is submitted, and IndexNow is switched on', 'BING'],
    ['hub', 'Business profile is claimed and verified in ChatGPT Business Hub', 'HUB'],
    ['gbp', 'Google Business Profile and Merchant Center details are up to date', 'G1'],
    ['li', 'For B2B: the LinkedIn company page is active and named experts publish structured posts', 'LI']
  ];

  // A made-up page with common mistakes, run through the real engine.
  var SAMPLE = {
    url: 'https://harborandpine.example/brew-guides/pour-over',
    page: { status: 200, finalUrl: 'https://harborandpine.example/brew-guides/pour-over', xRobotsTag: '', redirects: [], body:
      '<html><head><title>Home</title><link rel="canonical" href="https://harborandpine.example/brew-guides/pour-over"></head><body>' +
      '<nav><a href="/">Home</a><a href="/shop">Shop</a><a href="/brew-guides">Brew guides</a><a href="/about">About</a></nav>' +
      '<div class="page"><h1>Pour-over coffee guide</h1><h1>Harbor &amp; Pine Roasters</h1>' +
      '<img src="v60.jpg"><img src="kettle.jpg"><img src="bloom.jpg" alt="Coffee blooming in a V60 dripper">' +
      '<p>' + new Array(27).join('Pour-over coffee rewards patience and a steady hand, and our roasters have spent years refining it. ') + '</p>' +
      '<h2>Learn more</h2><p>Use 15 grams of medium-fine coffee to 250 grams of water at 94 degrees Celsius. Bloom for 30 seconds, then pour in slow circles until the scale reads 250 grams. Total brew time should land between two and a half and three minutes.</p>' +
      '<h2>Grind size and water temperature</h2><p>Grind slightly finer than table salt. Water just off the boil works for light roasts, and darker roasts taste better a few degrees cooler.</p>' +
      '<p>' + new Array(14).join('If the cup tastes sour, grind finer; if it tastes bitter, grind coarser and pour a little faster. ') + '</p>' +
      '</div><footer><a href="/contact">Contact</a></footer></body></html>' },
    robots: { status: 200, body: 'User-agent: *\nDisallow: /cart/\n\n# keep AI out of our content\nUser-agent: GPTBot\nUser-agent: OAI-SearchBot\nUser-agent: ClaudeBot\nDisallow: /\n' },
    sitemap: { status: 404 }, llms: { status: 404 }, notFound: { status: 200 },
    ua: { browser: 200, Googlebot: 200, Bingbot: 200, 'OAI-SearchBot': 200, 'ChatGPT-User': 200, 'Claude-SearchBot': 200, 'Claude-User': 200, PerplexityBot: 403, 'Perplexity-User': 200 }
  };

  var shown = { page: null, site: null, detail: null };
  var pagesView = { sort: 'none', blockersOnly: false };

  // ---------- small pieces ----------

  function dial(score, band, label) {
    var r = 62, c = 2 * Math.PI * r, off = c * (1 - score / 100);
    var color = band === 'strong' ? 'var(--good)' : band === 'fair' ? 'var(--warn)' : 'var(--bad)';
    var word = band === 'strong' ? 'Strong' : band === 'fair' ? 'Fair' : 'Needs work';
    return '<div class="dial"><svg viewBox="0 0 150 150" role="img" aria-label="' + label + ' ' + score + ' out of 100">' +
      '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="var(--idle-bg)" stroke-width="11"/>' +
      '<circle class="arc" cx="75" cy="75" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 75 75)"/>' +
      '<text class="num" x="75" y="84" text-anchor="middle">' + score + '</text><text class="of" x="75" y="104" text-anchor="middle">' + label + ' / 100</text></svg>' +
      '<span class="pill ' + (band === 'strong' ? 's-good' : band === 'fair' ? 's-warn' : 's-bad') + '">' + word + '</span></div>';
  }

  function snippetHtml(code, note, heading) {
    return code ? (heading ? '<h3>' + heading + '</h3>' : '') + '<pre>' + esc(code) + '</pre>' + (note ? '<p class="small muted">' + note + '</p>' : '') : '';
  }
  var ROBOTS_NOTE = 'A bot that has its own group ignores the <code>*</code> group, so copy across any Disallow lines you still want to apply to it. Remove the bot from any group that disallows it.';

  function actions(which) {
    return '<div class="row">' + (live ? '<button class="copylink" type="button">Copy link</button>' : '') +
      '<button class="copy" data-src="' + which + '" type="button">Copy as Markdown</button></div>';
  }

  // One sentence that says what the report found, before any numbers.
  function pageVerdict(r) {
    var shut = r.engines.filter(function (e) { return e.state !== 'open' && e.state !== 'unknown' && e.state !== 'partial'; });
    var partial = r.engines.filter(function (e) { return e.state === 'partial'; });
    var unknown = r.engines.filter(function (e) { return e.state === 'unknown'; });
    var names = function (a) { return list(a.map(function (e) { return SHORT[e.id]; })); };
    if (shut.length === r.engines.length) return ['No AI search engine can use this page.', 'bad'];
    if (shut.length) return [names(shut) + ' cannot use this page.', 'bad'];
    if (partial.length) return ['Every engine can index this page, but ' + names(partial) + ' cannot fetch it on request.', 'warn'];
    if (unknown.length) return ['Engine access was not checked, because no robots.txt was provided.', 'idle'];
    return ['All ' + r.engines.length + ' AI search engines can reach this page.', 'good'];
  }

  function engineRows(engines) {
    return '<div class="engines">' + engines.map(function (e) {
      var st = STATE[e.state];
      return '<div class="engine"><span class="name">' + esc(e.name) + '</span><span class="pill ' + st[1] + '">' + st[0] + '</span><span class="why">' +
        esc(e.reason) + (e.note && e.state !== 'open' ? ' ' + esc(e.note) : '') + '</span></div>';
    }).join('') + '</div>';
  }

  function fixItem(f, extra) {
    var lv = LEVEL[f.level];
    return '<li class="fix ' + (f.level === 'fix' ? 'fix-l' : f.level) + '"><div class="head"><strong>' + esc(f.title) + '</strong><span class="pill ' + lv[1] + '">' + lv[0] + '</span>' +
      (extra.pill || '') + (f.lost && !extra.pill ? '<span class="small muted mono">-' + f.lost + ' pts</span>' : '') + '</div>' +
      (extra.hideDetail ? '' : '<div class="muted small">' + esc(f.detail) + '</div>') +
      '<div class="do">' + esc(f.fix) + '</div>' + (extra.hideSnippet ? '' : snippetHtml(f.snippet, esc(f.snippetNote))) +
      '<div class="small">' + src(f.source) + '</div>' + (extra.after || '') + '</li>';
  }

  // Blocking problems and the next three are shown; the rest fold away.
  function fixLists(fixes, render) {
    var lead = fixes.filter(function (f) { return f.level === 'blocker'; }).length + 3;
    var top = fixes.slice(0, lead), rest = fixes.slice(lead);
    return '<ol class="fixes">' + top.map(render).join('') + '</ol>' +
      (rest.length ? '<details class="more"><summary>Show ' + rest.length + ' more</summary><ol class="fixes" style="counter-reset: fix ' + top.length + '">' + rest.map(render).join('') + '</ol></details>' : '');
  }

  // ---------- page report ----------

  function summaryCard(r, which, heading) {
    var v = pageVerdict(r);
    return '<section class="card"><div class="row" style="justify-content:space-between"><div><h2>' + heading + '</h2><div class="small muted mono">' + esc(r.url) + '</div></div>' + actions(which) + '</div>' +
      '<p class="verdict v-' + v[1] + '">' + esc(v[0]) + '</p>' +
      '<div class="summary"><div>' + engineRows(r.engines) + '</div>' + dial(r.score, r.band, 'page score') + '</div>' +
      (r.mode === 'paste' ? '<p class="small muted">Paste mode checks robots.txt rules and page content. The firewall test, sitemap lookup, redirect check and missing-page check need live mode. The home page checks run only when you paste the home page.</p>' : '') +
      '</section>';
  }

  function fixCard(r) {
    var h = '<section class="card"><h2>What to fix</h2>';
    if (!r.fixes.length) return h + '<p>Nothing to fix. Every engine can reach this page and every check passed.</p></section>';
    return h + '<p class="muted small">Problems that block engines come first, then checks by points lost.</p>' +
      fixLists(r.fixes, function (f) { return fixItem(f, {}); }) + snippetHtml(r.robotsSnippet, ROBOTS_NOTE, 'Add to robots.txt') + '</section>';
  }

  function checksCard(r) {
    return '<section class="card"><h2>All checks</h2><p class="muted small">Limits such as 150 words or 120-word paragraphs are starting values chosen for this tool, not rules set by the engines. <a href="' + SPEC_URL + '" target="_blank" rel="noopener">How the score is built</a></p>' +
      r.groups.map(function (g) {
        var bad = g.checks.filter(function (c) { return c.status === 'fail' || c.status === 'warn'; }).length;
        return '<details class="group"' + ((g.unscored ? bad : g.earned < g.max) ? ' open' : '') + '><summary><span class="gname"><strong>' + esc(g.name) + '</strong></span>' +
          (g.unscored ? '<span class="small muted">not scored</span><span class="pts">' + (bad ? plural(bad, 'issue') : 'ok') + '</span>'
            : '<span class="bar"><i style="width:' + (100 * g.earned / g.max) + '%"></i></span><span class="pts">' + g.earned + '/' + g.max + '</span>') + '</summary>' +
          '<div class="tablewrap"><table><thead><tr><th>Check</th><th>Result</th><th>Points</th></tr></thead><tbody>' +
          g.checks.map(function (c) {
            var st = CHECK[c.status];
            return '<tr title="Check ' + c.id + '"><td><strong>' + esc(c.title) + '</strong><div class="muted small">' + esc(c.detail) + ' ' + src(c.source) + '</div></td>' +
              '<td><span class="pill ' + st[1] + '">' + st[0] + '</span></td><td class="n">' + (c.points ? c.earned + '/' + c.points : '&ndash;') + '</td></tr>';
          }).join('') + '</tbody></table></div></details>';
      }).join('') + '</section>';
  }

  function siteWideCards(r) {
    var h = '<section class="card"><h2>Training crawlers</h2><p class="muted">These collect content for model training. Blocking them is your choice and does not change the score or your visibility in AI search.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Bot</th><th>Operator</th><th>robots.txt</th><th>What blocking does</th></tr></thead><tbody>' +
      r.training.map(function (t) {
        var p = t.robots === 'allowed' ? 'Allowed' : t.robots === 'disallowed' ? 'Blocked' : 'Not checked';
        return '<tr><td class="n">' + t.token + '</td><td>' + t.operator + '</td><td><span class="pill s-idle">' + p + '</span></td><td class="small">' + esc(t.meaning) + ' ' + src(t.source) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';

    h += '<section class="card"><h2>Check these yourself</h2><p class="muted">These live in accounts this tool cannot see. Ticks are saved in this browser.</p><ul class="checks">' +
      MANUAL.map(function (m) { return '<li><label for="m-' + m[0] + '"><input type="checkbox" id="m-' + m[0] + '" data-k="' + m[0] + '"><span>' + esc(m[1]) + ' <span class="small">' + src(E.SOURCES[m[2]]) + '</span></span></label></li>'; }).join('') + '</ul></section>';

    var llms = r.facts.llmsTxt === 'present' ? 'This site has an llms.txt file.' : r.facts.llmsTxt === 'absent' ? 'This site has no llms.txt file.' : 'llms.txt was not checked.';
    return h + '<section class="card"><h2>Not scored, on purpose</h2><ul class="plain">' +
      '<li><strong>llms.txt.</strong> ' + llms + ' Google says Search does not use it, so it earns no points either way. Other services may read it.</li>' +
      '<li><strong>Chunking content.</strong> Google says there is no ideal page length. Only very long paragraphs are flagged, following Microsoft.</li>' +
      '<li><strong>Special AI markup.</strong> None exists. Ordinary schema counts for 10 points because it must match the page.</li>' +
      '<li><strong>Keyword variants and bought mentions.</strong> Not checked. ' + src(E.SOURCES.G2) + '</li></ul></section>';
  }

  // ---------- what changed since the last audit of the same address ----------

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function snapshot(r) {
    var issues = {};
    r.fixes.forEach(function (f) { issues[f.id || f.title] = f.title; });
    return { t: Date.now(), score: r.score, issues: issues };
  }

  function changesCard(r, kind) {
    var key = 'quotable-last-' + kind + '-' + r.url.replace(/\/+$/, '').toLowerCase();
    var before = null, now = snapshot(r);
    try { before = JSON.parse(store(key)); } catch (e) { /* no earlier audit */ }
    store(key, JSON.stringify(now));
    if (!before || !before.issues) return '';
    var fixed = Object.keys(before.issues).filter(function (k) { return !(k in now.issues); }).map(function (k) { return before.issues[k]; });
    var added = Object.keys(now.issues).filter(function (k) { return !(k in before.issues); }).map(function (k) { return now.issues[k]; });
    var when = new Date(before.t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    var diff = now.score - before.score;
    var h = '<section class="card changes"><h2>Since your last audit</h2><p class="muted small">Compared with the audit you ran in this browser on ' + esc(when) + '.</p>';
    if (!diff && !fixed.length && !added.length) return h + '<p>Nothing has changed.</p></section>';
    h += '<p><strong>Score ' + before.score + ' &rarr; ' + now.score + '</strong>' + (diff ? ' (' + (diff > 0 ? '+' : '') + diff + ')' : '') + '</p>';
    if (fixed.length) h += '<p><span class="pill s-good">Fixed</span> ' + esc(fixed.join('; ')) + '</p>';
    if (added.length) h += '<p><span class="pill s-bad">New</span> ' + esc(added.join('; ')) + '</p>';
    return h + '</section>';
  }

  // ---------- rendering ----------

  function intro() {
    shown = { page: null, site: null, detail: null };
    $('report').innerHTML = '<section class="card intro"><h2>What you get</h2><ul class="plain">' +
      '<li><strong>Which engines can get in.</strong> Google AI Overviews, Copilot, ChatGPT search, Claude and Perplexity, checked against your robots.txt, firewall and index settings.</li>' +
      '<li><strong>A page score out of 100</strong> for how easy the page is to read and quote.</li>' +
      '<li><strong>A fix list in priority order</strong>, with code to paste where that helps. Each finding links to the engine\'s own documentation.</li></ul>' +
      '<p class="small muted">The score reports access and readability. It does not predict rankings or citations.</p>' +
      '<div><button type="button" id="example">See an example report</button></div></section>';
  }

  function render(r, isSample) {
    shown = { page: r, site: null, detail: null };
    $('report').innerHTML =
      (isSample ? '<div class="notice"><strong>Example report.</strong> This is a made-up coffee roaster page with common mistakes. Enter your own address above to audit a real page.</div>' : changesCard(r, 'page')) +
      summaryCard(r, 'page', 'Summary') + fixCard(r) + checksCard(r) + siteWideCards(r);
    restoreChecklist();
  }

  function siteVerdict(r) {
    var n = r.pages.length;
    var shut = r.engines.filter(function (e) { return e.open === 0; }), some = r.engines.filter(function (e) { return e.open > 0 && e.open < e.total; });
    var names = function (a) { return list(a.map(function (e) { return SHORT[e.id]; })); };
    if (shut.length === r.engines.length) return ['No AI search engine can use any of the ' + n + ' pages audited.', 'bad'];
    if (shut.length) return [names(shut) + ' cannot use any of the ' + n + ' pages audited.', 'bad'];
    if (some.length) {
      var worst = Math.max.apply(null, some.map(function (e) { return e.total - e.open; }));
      return ['Engines can reach most of the site, but ' + plural(worst, 'page') + ' out of ' + n + ' ' + (worst === 1 ? 'is' : 'are') + ' closed to at least one engine.', 'warn'];
    }
    return ['All ' + r.engines.length + ' AI search engines can reach all ' + n + ' pages audited.', 'good'];
  }

  function siteEngineRows(r) {
    return '<div class="engines">' + r.engines.map(function (e) {
      var pill = e.open === e.total ? ['Open', 's-good'] : e.open === 0 ? STATE[e.state] : ['Open on ' + e.open + ' of ' + e.total, 's-warn'];
      var why = e.open === e.total ? '' : e.open === 0 ? e.example : '';
      return '<div class="engine"><span class="name">' + esc(e.name) + '</span><span class="pill ' + pill[1] + '">' + pill[0] + '</span>' +
        (why ? '<span class="why">' + esc(why) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  // Each kind of exception is stated once, with the engines and pages it covers.
  function exceptionsHtml(r) {
    var byState = {};
    r.engines.forEach(function (e) {
      if (e.open === 0 || e.open === e.total) return;
      Object.keys(e.exceptions).forEach(function (state) {
        var item = byState[state] = byState[state] || { engines: [], urls: {} };
        item.engines.push(SHORT[e.id]);
        e.exceptions[state].forEach(function (u) { item.urls[u] = true; });
      });
    });
    var states = Object.keys(byState);
    if (!states.length) return '';
    return '<ul class="plain small exceptions">' + states.map(function (state) {
      var item = byState[state], urls = Object.keys(item.urls);
      return '<li><strong>' + STATE[state][0] + '</strong> on ' + plural(urls.length, 'page') + ', for ' + (item.engines.length === r.engines.length ? 'every engine' : esc(list(item.engines))) + ': ' +
        urls.slice(0, 3).map(esc).join(', ') + (urls.length > 3 ? ' and ' + (urls.length - 3) + ' more' : '') + '. Open the page below for the reason.</li>';
    }).join('') + '</ul>';
  }

  function pageRows() {
    var r = shown.site, rows = r.pages.map(function (p, i) { return { p: p, i: i }; });
    if (pagesView.blockersOnly) rows = rows.filter(function (x) { return x.p.report.fixes.some(function (f) { return f.level === 'blocker'; }); });
    if (pagesView.sort !== 'none') rows.sort(function (a, b) { return pagesView.sort === 'asc' ? a.p.score - b.p.score : b.p.score - a.p.score; });
    if (!rows.length) return '<tr><td colspan="4" class="muted">No pages match.</td></tr>';
    return rows.map(function (x) {
      var p = x.p, pill = p.band === 'strong' ? ['Strong', 's-good'] : p.band === 'fair' ? ['Fair', 's-warn'] : ['Needs work', 's-bad'];
      return '<tr><td><button class="link" type="button" data-page="' + x.i + '">' + esc(p.url) + '</button></td><td class="n">' + p.score + '</td>' +
        '<td><span class="pill ' + pill[1] + '">' + pill[0] + '</span></td><td class="n">' + p.issues + '</td></tr>';
    }).join('');
  }

  function renderSite(r) {
    shown = { page: null, site: r, detail: null };
    pagesView = { sort: 'none', blockersOnly: false };
    var n = r.pages.length, sm = r.sampled, v = siteVerdict(r);
    var how = sm.source === 'none' ? 'No other pages were found in a sitemap or in the links on that page.'
      : sm.source === 'sitemap' ? 'Pages come from the sitemap, which lists ' + sm.listed + ' addresses. Legal and account pages, translations, files and pages that robots.txt closes to all crawlers are skipped.'
      : 'Pages come from the links on the page you entered, because no sitemap was found.';
    if (r.failed) how += ' The server stopped answering part way through, so ' + (sm.eligible - n - r.errors.length) + ' pages were not audited.';
    else if (r.stopped) how += ' You stopped the audit early, so ' + (sm.eligible - n - r.errors.length) + ' pages were not audited.';
    else if (sm.capped) how += ' The site has ' + sm.eligible + ' eligible pages; one audit covers ' + (n + r.errors.length) + ' of them, spread across its sections.';

    var h = changesCard(r, 'site') +
      '<section class="card"><div class="row" style="justify-content:space-between"><div><h2>Site summary</h2><div class="small muted mono">' + esc(r.url) + '</div></div>' + actions('site') + '</div>' +
      '<p class="verdict v-' + v[1] + '">' + esc(v[0]) + '</p>' +
      '<div class="summary"><div>' + siteEngineRows(r) + exceptionsHtml(r) + '</div>' + dial(r.score, r.band, 'average score') + '</div>' +
      '<p class="small muted"><strong>' + plural(n, 'page') + ' audited.</strong> ' + how +
      (r.errors.length ? ' ' + plural(r.errors.length, 'page') + ' could not be fetched.' : '') + ' The firewall test ran on the page you entered only.</p></section>';

    h += '<section class="card"><h2>What to fix across the site</h2>';
    if (!r.fixes.length) h += '<p>Nothing to fix on the pages audited.</p>';
    else {
      h += '<p class="muted small">Problems that block engines come first, then the fixes that affect the most pages.</p>' + fixLists(r.fixes, function (f) {
        return fixItem(f, {
          pill: '<span class="pill s-idle">' + (f.siteWide ? 'Whole site' : f.pages.length + ' of ' + n + ' pages') + '</span>',
          hideDetail: !f.siteWide, hideSnippet: !f.siteWide,
          after: f.siteWide ? '' : '<details><summary>Pages affected</summary><ul>' + f.pages.map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul></details>'
        });
      }) + snippetHtml(r.robotsSnippet, ROBOTS_NOTE, 'Add to robots.txt');
    }
    h += '</section>';

    h += '<section class="card"><div class="row" style="justify-content:space-between"><h2>Pages</h2>' +
      '<label class="check"><input type="checkbox" id="blockersOnly"> Only pages with blocking problems</label></div>' +
      '<p class="muted small">Choose a page to see its full report.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Page</th><th><button class="link" type="button" id="sortScore" aria-label="Sort by score">Score <span id="sortMark" aria-hidden="true">&#8597;</span></button></th><th>Rating</th><th>Issues</th></tr></thead>' +
      '<tbody id="pageRows"></tbody></table></div></section>';

    $('report').innerHTML = h + '<div id="detail"></div>' + siteWideCards(r);
    $('pageRows').innerHTML = pageRows();
    restoreChecklist();
  }

  function showDetail(i) {
    var r = shown.site.pages[i].report;
    shown.detail = r;
    $('detail').innerHTML = summaryCard(r, 'detail', 'Page report') + fixCard(r) + checksCard(r);
    $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function restoreChecklist() {
    Array.prototype.forEach.call(document.querySelectorAll('.checks input'), function (cb) { cb.checked = store('quotable-' + cb.dataset.k) === '1'; });
  }

  function flash(btn, text) {
    var old = btn.textContent; btn.textContent = text;
    setTimeout(function () { btn.textContent = old; }, 1800);
  }
  function copy(btn, text) {
    try { navigator.clipboard.writeText(text).then(function () { flash(btn, 'Copied'); }, function () { flash(btn, 'Copy was blocked'); }); } catch (e) { flash(btn, 'Copy was blocked'); }
  }

  $('report').addEventListener('change', function (ev) {
    if (ev.target.matches('.checks input')) store('quotable-' + ev.target.dataset.k, ev.target.checked ? '1' : '0');
    if (ev.target.id === 'blockersOnly') { pagesView.blockersOnly = ev.target.checked; $('pageRows').innerHTML = pageRows(); }
  });
  $('report').addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.id === 'example') return render(E.audit(SAMPLE), true);
    if (t.dataset.page !== undefined) return showDetail(+t.dataset.page);
    if (t.id === 'sortScore') {
      pagesView.sort = pagesView.sort === 'asc' ? 'desc' : 'asc';
      $('sortMark').innerHTML = pagesView.sort === 'asc' ? '&#8593;' : '&#8595;';
      t.setAttribute('aria-label', 'Sorted by score, ' + (pagesView.sort === 'asc' ? 'lowest first' : 'highest first'));
      return void ($('pageRows').innerHTML = pageRows());
    }
    if (t.classList.contains('copylink')) return copy(t, location.href);
    if (t.classList.contains('copy')) {
      var which = t.dataset.src;
      copy(t, which === 'site' ? E.siteToMarkdown(shown.site) : E.toMarkdown(shown[which]));
    }
  });

  function say(text, isErr) { $('msg').innerHTML = text ? '<div class="notice' + (isErr ? ' err' : '') + '">' + esc(text) + '</div>' : ''; }

  // ---------- running audits ----------

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (res) {
        return res.json().then(function (json) { json.retryAfter = res.status === 429 ? +res.headers.get('Retry-After') || 5 : 0; return json; });
      });
  }
  function pause(seconds) { return new Promise(function (done) { setTimeout(done, seconds * 1000); }); }

  // Puts the audited address in the page's own address, so the report can be bookmarked and sent.
  function remember(url, site) {
    try { history.replaceState(null, '', '?url=' + encodeURIComponent(url) + (site ? '&scope=site' : '')); } catch (e) { /* not allowed here */ }
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var url = $('url').value.trim();
    if (!url) return say('Enter the address of the page you want to audit.', true);
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch (e) { return say('That does not look like a web address. Try something like https://example.com/pricing', true); }

    if (!live) {
      var html = $('html').value;
      if (!html.trim()) return say('Paste the page source to audit it here.', true);
      var robotsTxt = $('robots').value;
      say('');
      render(E.audit({ url: url, page: { status: null, finalUrl: url, xRobotsTag: '', body: html },
        robots: { status: robotsTxt.trim() ? 200 : 404, body: robotsTxt }, sitemap: { status: null }, llms: { status: null }, ua: null }), false);
      return;
    }
    var site = document.querySelector('input[name="scope"]:checked').value === 'site';
    var btn = $('run'); btn.disabled = true; btn.textContent = 'Auditing';
    if (site) say('Fetching the page and reading the sitemap.');
    (site ? post('api/collect-site', { url: url }) : collectWithSteps(url))
      .then(function (bundle) {
        if (bundle.retryAfter) return say(bundle.error, true);
        if (bundle.error) return say(bundle.error, true);
        remember(url, site);
        if (!site) { say(''); return render(E.audit(bundle), false); }
        return auditWholeSite(bundle);
      })
      .catch(function () { say('The server did not answer. Wait a moment and try again.', true); })
      .then(function () { btn.disabled = false; btn.textContent = 'Run audit'; });
  });

  // Fetches one page's bundle, showing each lookup as the server finishes it.
  function collectWithSteps(url) {
    var seen = {}, bots = [], botTotal = 8, atHome = true;
    try { var parsed = new URL(url); atHome = (parsed.pathname === '/' || parsed.pathname === '') && !parsed.search; } catch (e) { /* checked earlier */ }
    function row(done, bad, text) {
      return '<li class="' + (done ? 'done' : '') + (bad ? ' bad' : '') + '"><span class="mark" aria-hidden="true">' + (!done ? '&middot;' : bad ? '!' : '&#10003;') + '</span><span>' + esc(text) + '</span></li>';
    }
    function draw() {
      var p = seen.page, r = seen.robots, s = seen.sitemap, n = seen.notFound, h = seen.home;
      var blocked = bots.filter(function (b) { return [401, 403, 406, 429, 503].indexOf(b.status) >= 0; });
      var rows = [
        !p ? row(false, false, 'Fetching the page') : row(true, p.status !== 200, 'Page fetched: status ' + p.status + (p.redirects ? ' after ' + plural(p.redirects, 'redirect') : '')),
        !r ? row(false, false, 'Reading robots.txt') : row(true, r.status === null || r.status >= 500, r.status === 200 ? 'robots.txt read' : r.status === null ? 'robots.txt could not be fetched' : 'No robots.txt (status ' + r.status + ')'),
        !s ? row(false, false, 'Looking for a sitemap') : row(true, false, s.status === 200 ? 'Sitemap found at /sitemap.xml' : 'No sitemap at /sitemap.xml'),
        !n ? row(false, false, 'Testing a missing page') : row(true, n.status === 200, n.status === 200 ? 'A missing page returned 200 instead of 404' : n.status === null ? 'Missing-page test could not run' : 'Missing pages return ' + n.status)
      ];
      if (!atHome || h) rows.push(!h ? row(false, false, 'Reading the home page') : row(true, h.status !== 200, h.status === 200 ? 'Home page read' : 'Home page could not be read'));
      rows.push(bots.length < botTotal
        ? row(false, false, 'Testing each AI crawler: ' + bots.length + ' of ' + botTotal + (bots.length ? ' (' + bots[bots.length - 1].token + ')' : ''))
        : row(true, blocked.length > 0, blocked.length ? plural(blocked.length, 'crawler') + ' refused: ' + list(blocked.map(function (b) { return b.token; })) : 'All ' + botTotal + ' crawlers got through'));
      $('msg').innerHTML = '<div class="notice"><ul class="steps">' + rows.join('') + '</ul></div>';
    }
    function take(event) {
      if (event.step === 'bot') bots.push(event); else if (event.step) seen[event.step] = event;
      if (event.step) draw();
    }
    draw();
    return fetch('api/collect-stream', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url }) }).then(function (res) {
      // An older server, or a browser that cannot read a response as it arrives: ask the plain way.
      if (res.status === 404 || res.status === 405 || !res.body || !res.body.getReader) return post('api/collect', { url: url });
      if (res.status !== 200) return res.json().then(function (json) { json.retryAfter = res.status === 429 ? 1 : 0; return json; });
      var reader = res.body.getReader(), decoder = new TextDecoder(), buffer = '', result = null;
      function handle(line) {
        if (!line.trim()) return;
        var event = JSON.parse(line);
        if (event.done) result = event.done; else if (event.error) result = { error: event.error }; else take(event);
      }
      function read() {
        return reader.read().then(function (chunk) {
          buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
          var lines = buffer.split('\n');
          buffer = chunk.done ? '' : lines.pop();
          lines.forEach(handle);
          if (!chunk.done) return read();
          if (!result) throw new Error('The audit ended early.');
          return result;
        });
      }
      return read();
    });
  }

  // Audits the entered page, then works through the rest of the site in batches.
  function auditWholeSite(site) {
    var entries = site.pages.map(function (p) { return E.auditSitePage(site.shared, p); });
    var queue = site.queue || [], total = queue.length + entries.length, size = site.sampled.batch || 10;
    var errors = [], stopped = false, failed = false, at = 0;
    function progress(note) {
      var done = entries.length + errors.length;
      $('msg').innerHTML = '<div class="notice"><div class="row" style="justify-content:space-between"><span>Audited ' + done + ' of ' + total +
        ' pages.' + (note ? ' ' + esc(note) : '') + '</span><button type="button" id="stop">Stop and show results</button></div>' +
        '<div class="bar" style="margin-top:10px"><i style="width:' + (100 * done / total) + '%"></i></div></div>';
      $('stop').onclick = function () { stopped = true; this.disabled = true; this.textContent = 'Stopping'; };
    }
    function waitOrStop(seconds) { // a pause that ends as soon as the person presses Stop
      return seconds <= 0 || stopped ? Promise.resolve() : pause(0.25).then(function () { return waitOrStop(seconds - 0.25); });
    }
    function next() {
      if (stopped || at >= queue.length) return;
      progress('');
      var urls = queue.slice(at, at + size);
      return post('api/collect-pages', { urls: urls }).then(function (res) {
        if (res.retryAfter) {
          progress('Pausing ' + res.retryAfter + ' seconds to stay within the rate limit.');
          return waitOrStop(res.retryAfter).then(next);
        }
        if (res.error) throw new Error(res.error);
        at += urls.length;
        res.pages.forEach(function (p) { entries.push(E.auditSitePage(site.shared, p)); });
        errors = errors.concat(res.errors);
        return next();
      });
    }
    return Promise.resolve(next()).catch(function () { failed = true; }).then(function () {
      say('');
      site.errors = errors;
      var report = E.buildSite(site, entries);
      report.stopped = stopped && at < queue.length;
      report.failed = failed;
      renderSite(report);
    });
  }

  function setMode(isLive) {
    live = isLive;
    $('paste').hidden = isLive;
    $('scope').hidden = !isLive;
    $('modeNote').innerHTML = isLive
      ? 'Fetches the page and robots.txt, then requests the page as each AI crawler to spot firewall blocks. Whole site audits every page in your sitemap.'
      : (/github\.io$/.test(location.hostname) ? 'This copy cannot fetch websites. <a href="' + LIVE_URL + '">Open the live app</a> to audit a page by its address, or paste the page source and robots.txt below.'
        : 'No audit server is running here, so paste the page source and robots.txt below.');
  }

  $('sources').innerHTML = Object.keys(E.SOURCES).map(function (k) { return '<li>' + src(E.SOURCES[k]) + '</li>'; }).join('');
  setMode(false);
  intro();

  var params = new URLSearchParams(location.search), wanted = params.get('url');
  if (wanted) $('url').value = wanted;
  if (params.get('scope') === 'site') document.querySelector('input[value="site"]').checked = true;

  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  if (ctl) setTimeout(function () { ctl.abort(); }, 2500);
  fetch('api/health', ctl ? { signal: ctl.signal } : {})
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (j) {
      if (!j || !j.ok) return;
      setMode(true);
      if (wanted) $('run').click(); // a shared link reruns its audit
    })
    .catch(function () { /* no backend: stay in paste mode */ });
})();
</script>
</body>
</html>
